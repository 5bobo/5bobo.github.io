<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 275" role="img" aria-labelledby="title">
<title id="title">Lexicographic MPC priority hierarchy</title>
<rect width="780" height="275" fill="#f4f6f3"/>
<g font-family="system-ui,sans-serif" fill="#18232b">
<text x="28" y="43" font-size="20" font-weight="650">Priority hierarchy</text>
<g fill="white" stroke="#b7c8c3"><rect x="28" y="70" width="210" height="126"/><rect x="283" y="70" width="214" height="126"/><rect x="542" y="70" width="210" height="126"/></g>
<g font-size="13" fill="#215c68"><text x="45" y="101">01 / HIGH PRIORITY</text><text x="300" y="101">02 / ADD CONSTRAINT</text><text x="559" y="101">03 / LOWER PRIORITY</text></g>
<g font-size="18" font-weight="600"><text x="45" y="137">Optimize formation</text><text x="300" y="137">Protect formation</text><text x="559" y="137">Optimize navigation</text></g>
<g font-size="15"><text x="45" y="169">Record solved cost J₁*</text><text x="300" y="169">Require J₁ ≤ J₁* + ε</text><text x="559" y="169">Apply the first input</text></g>
<text x="28" y="239" font-size="14">Both solves retain kinematic, input and obstacle constraints.</text>
</g>
<path d="M248 133h24l-6-5m6 5-6 5m241-5h24l-6-5m6 5-6 5" fill="none" stroke="#215c68" stroke-width="2"/>
</svg>
